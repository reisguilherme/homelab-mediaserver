name: Build HomeServer release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on main with successful HomeServer CI
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: homeserver-release-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Require exact tested commit
        env:
          TARGET_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_COMMIT}&status=completed&per_page=100" --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .event == "push" and .head_branch == "main" and .conclusion == "success") | .id')"
          test -n "$runs"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.8.0'
      - name: Install dependencies and inspect source
        run: |
          uv sync --frozen
          bash scripts/check-secrets.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable artifact and image manifest
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: uv run bash scripts/build-release.sh --output "$RUNNER_TEMP/homeserver-release" --image-prefix "$IMAGE_PREFIX"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homeserver-release-${{ inputs.commit }}
          path: ${{ runner.temp }}/homeserver-release/
          if-no-files-found: error
          retention-days: 14
