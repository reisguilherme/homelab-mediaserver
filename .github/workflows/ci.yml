name: HomeServer CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Install uv and locked dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen
      - name: Lint
        run: uv run make lint
      - name: Unit tests
        run: uv run make test-unit
      - name: Contract tests
        run: uv run make test-contract
      - name: Integration tests
        run: uv run make test-integration
      - name: Compose render
        run: uv run make compose-check
      - name: Smoke tests
        run: uv run make smoke
