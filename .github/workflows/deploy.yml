name: Deploy HomeServer

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit on main validated by HomeServer CI
        required: true
        type: string
      release_run:
        description: Successful Build HomeServer release workflow run ID
        required: true
        type: string

concurrency:
  group: homeserver-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit }}
      - name: Require the exact tested release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.commit }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_COMMIT}&status=completed&per_page=100" --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .name == "HomeServer CI" and .event == "push" and .head_branch == "main" and .conclusion == "success") | .id')"
          test -n "$runs"
          # workflow_dispatch records the workflow ref SHA, while release.yml
          # explicitly checks out and verifies inputs.commit before building.
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN}" --jq '. | select(.path == ".github/workflows/release.yml" and .event == "workflow_dispatch" and .conclusion == "success") | .id')"
          test "$verified" = "$RELEASE_RUN"
      - name: Download immutable release files
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.commit }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/homeserver-release"
          gh run download "$RELEASE_RUN" --name "homeserver-release-${TARGET_COMMIT}" --dir "$output_dir"
          test -s "$output_dir/homeserver-${TARGET_COMMIT}.tar"
          test -s "$output_dir/homeserver-${TARGET_COMMIT}.json"
          python3 scripts/validate-release.py \
            --release "$TARGET_COMMIT" \
            --artifact "$output_dir/homeserver-${TARGET_COMMIT}.tar" \
            --manifest "$output_dir/homeserver-${TARGET_COMMIT}.json"
      - name: Connect to the private tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:homeserver-ci
      - name: Configure authenticated SSH
        env:
          SSH_KEY: ${{ secrets.HOMESERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOMESERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Transfer and deploy the identified release
        env:
          HOMESERVER_SSH_HOST: ${{ secrets.HOMESERVER_SSH_HOST }}
          HOMESERVER_SSH_USER: ${{ secrets.HOMESERVER_SSH_USER }}
          INSTALL_ROOT: ${{ vars.HOMESERVER_INSTALL_ROOT || '/opt/homeserver' }}
          ENV_FILE: ${{ vars.HOMESERVER_ENV_FILE || '/etc/homeserver/.env' }}
          TARGET_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$HOMESERVER_SSH_HOST" =~ ^[a-zA-Z0-9._:-]+$ ]]
          [[ "$HOMESERVER_SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$INSTALL_ROOT" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$ENV_FILE" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          remote="${HOMESERVER_SSH_USER}@${HOMESERVER_SSH_HOST}"
          remote_artifact="/tmp/homeserver-release-${TARGET_COMMIT}.tar"
          remote_manifest="/tmp/homeserver-release-${TARGET_COMMIT}.json"
          cleanup() {
            ssh "$remote" "rm -f -- '$remote_artifact' '$remote_manifest'" || true
          }
          trap cleanup EXIT
          scp "$RUNNER_TEMP/homeserver-release/homeserver-${TARGET_COMMIT}.tar" "$remote:$remote_artifact"
          scp "$RUNNER_TEMP/homeserver-release/homeserver-${TARGET_COMMIT}.json" "$remote:$remote_manifest"
          ssh "$remote" sudo bash "$INSTALL_ROOT/current/scripts/deploy.sh" \
            --release "$TARGET_COMMIT" \
            --artifact "$remote_artifact" \
            --manifest "$remote_manifest" \
            --env-file "$ENV_FILE"
