# Opt-in physical storage; prepare mounts and private registry first.
services:
  sonarr:
    volumes:
    - type: bind
      source: /srv/media-view
      target: /data
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ./scripts/storage-entrypoint.sh
      target: /run/storage-entrypoint.sh
      read_only: true
      bind:
        create_host_path: false
    entrypoint:
    - /bin/sh
    - /run/storage-entrypoint.sh
    - /data
    - /init
  radarr:
    volumes:
    - type: bind
      source: /srv/media-view
