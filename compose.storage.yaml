  control-worker:
    volumes:
    - type: bind
      source: /srv/media-view
      target: /data
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data
      target: /storage/ssd
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/external
      target: /storage/hdd
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /proc/1/mountinfo
      target: /run/host-mountinfo
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /dev/disk/by-uuid
      target: /run/host-uuids
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/appdata/control/storage.json
      target: /run/homeserver/storage.json
      read_only: true
      bind:
        create_host_path: false
    user: 0:0
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - SETUID
    - SETGID
    entrypoint:
    - python
    - -m
    - homeserver_common.storage_startup
    - python
    - -m
    - homeserver_common.runtime
  control-api:
    volumes:
    - type: bind
      source: /srv/media-view
      target: /data
      read_only: true
      bind:
        create_host_path: false
    - type: bind
