# Development state is isolated below HOMESERVER_RUNTIME (default
# ../.runtime/dev because Compose resolves relative bind sources from this deploy directory).
services:
  jellyfin:
    volumes:
      - type: bind
        source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/jellyfin
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
        target: /data/media
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HOMESERVER_TRANSCODE_ROOT:-../.runtime/dev/transcode}
        target: /transcode
        bind: {create_host_path: false}
  jellyfin-proxy:
    ports:
      - "127.0.0.1:18096:8096"
  seerr:
    ports: ["127.0.0.1:18091:5055"]
  sonarr:
    ports: ["127.0.0.1:18989:8989"]
    volumes:
      - type: bind
        source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/sonarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
        target: /data
        bind: {create_host_path: false}
  radarr:
    ports: ["127.0.0.1:17878:7878"]
    volumes:
      - type: bind
        source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/radarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
        target: /data
        bind: {create_host_path: false}
  qbittorrent:
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - type: bind
        source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/qbittorrent
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
        target: /data
        bind: {create_host_path: false}
  control-api:
    ports: ["127.0.0.1:18082:8080"]
    environment:
      HOMESERVER_MEDIA_ROOTS: /data/media:/data/torrents
      HOMESERVER_ADMIN_TOKEN: ${HOMESERVER_ADMIN_TOKEN:-local-dev-only-admin}
      HOMESERVER_CSRF_TOKEN: ${HOMESERVER_CSRF_TOKEN:-local-dev-only-csrf}
      HOMESERVER_COLLECTOR_TOKEN: ${HOMESERVER_COLLECTOR_TOKEN:-local-dev-only-collector}
      HOMESERVER_MEDIA_UUID: ${HOMESERVER_MEDIA_UUID:-}
      HOMESERVER_JELLYFIN_URL: http://jellyfin:8096
      HOMESERVER_RADARR_URL: ${HOMESERVER_RADARR_URL:-http://radarr:7878}
      HOMESERVER_RADARR_API_KEY: ${HOMESERVER_RADARR_API_KEY:-}
      HOMESERVER_SONARR_URL: ${HOMESERVER_SONARR_URL:-http://sonarr:8989}
      HOMESERVER_SONARR_API_KEY: ${HOMESERVER_SONARR_API_KEY:-}
      HOMESERVER_DB_PATH: /var/lib/homeserver/control.sqlite
      HOMESERVER_CAPACITY_SNAPSHOT: /run/homeserver/capacity.json
      HOMESERVER_RECOVERY_MODE: /var/lib/homeserver/RECOVERY_MODE
    volumes:
      - type: bind
        source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/control
        target: /var/lib/homeserver
        bind: {create_host_path: false}
      - type: bind
        source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
        target: /data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HOMESERVER_RUNTIME:-../.runtime/dev}/run
        target: /run/homeserver
        read_only: true
        bind: {create_host_path: false}
  telemetry:
    ports: ["127.0.0.1:18081:8080"]
  control-worker:
    environment:
      HOMESERVER_DB_PATH: /var/lib/homeserver/control.sqlite
      HOMESERVER_MEDIA_UUID: ${HOMESERVER_MEDIA_UUID:-}
      HOMESERVER_JELLYFIN_URL: http://jellyfin:8096
      HOMESERVER_JELLYFIN_API_KEY: ${HOMESERVER_JELLYFIN_API_KEY:-}
      HOMESERVER_SEERR_URL: ${HOMESERVER_SEERR_URL:-}
      HOMESERVER_SEERR_API_KEY: ${HOMESERVER_SEERR_API_KEY:-}
      HOMESERVER_CAPACITY_SNAPSHOT: ${HOMESERVER_CAPACITY_SNAPSHOT:-/run/homeserver/capacity.json}
      HOMESERVER_RECOVERY_MODE: /var/lib/homeserver/RECOVERY_MODE
    volumes:
      - type: bind
        source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/control
        target: /var/lib/homeserver
        bind: {create_host_path: false}
      - type: bind
        source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${HOMESERVER_RUNTIME:-../.runtime/dev}/run
        target: /run/homeserver
        read_only: true
        bind: {create_host_path: false}
  download-gateway:
    environment:
      HOMESERVER_DB_PATH: /var/lib/homeserver/control.sqlite
      HOMESERVER_RECOVERY_MODE: /var/lib/homeserver/RECOVERY_MODE
    volumes:
      - type: bind
        source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/control
        target: /var/lib/homeserver
        bind: {create_host_path: false}
  mosquitto:
    volumes:
      - type: bind
        source: ${HOMESERVER_MQTT_PASSWD:-../.runtime/dev/mosquitto/passwd}
        target: /mosquitto/config/passwd
        read_only: true
        bind: {create_host_path: false}
