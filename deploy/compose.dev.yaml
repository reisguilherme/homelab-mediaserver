services:
  jellyfin:
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/jellyfin
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}/media
      target: /data/media
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMESERVER_TRANSCODE_ROOT:-../.runtime/dev/transcode}
      target: /transcode
      read_only: false
      bind:
        create_host_path: false
  jellyfin-proxy:
    ports: !override
    - host_ip: 127.0.0.1
      published: '18096'
      target: 8096
      protocol: tcp
  seerr:
    ports: !override
    - host_ip: 127.0.0.1
      published: '18091'
      target: 5055
      protocol: tcp
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/seerr
      target: /app/config
      read_only: false
      bind:
        create_host_path: false
  sonarr:
    ports: !override
    - host_ip: 127.0.0.1
      published: '18989'
      target: 8989
      protocol: tcp
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/sonarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
      target: /data
      read_only: false
      bind:
        create_host_path: false
  radarr:
    ports: !override
    - host_ip: 127.0.0.1
      published: '17878'
      target: 7878
      protocol: tcp
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/radarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
      target: /data
      read_only: false
      bind:
        create_host_path: false
  prowlarr:
    ports: !override
    - host_ip: 127.0.0.1
      published: '19696'
      target: 9696
      protocol: tcp
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/prowlarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
  bazarr:
    ports: !override
    - host_ip: 127.0.0.1
      published: '16767'
      target: 6767
      protocol: tcp
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/bazarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}/media
      target: /data/media
      read_only: false
      bind:
        create_host_path: false
  qbittorrent:
    ports: !override
    - host_ip: 127.0.0.1
      published: '6881'
      target: ${HOMESERVER_QBIT_PEER_PORT:-6881}
      protocol: tcp
    - host_ip: 127.0.0.1
      published: '6881'
      target: ${HOMESERVER_QBIT_PEER_PORT:-6881}
      protocol: udp
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/qbittorrent
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
      target: /data
      read_only: false
      bind:
        create_host_path: false
  qbit-monitor:
    ports: !override
    - host_ip: 127.0.0.1
      published: '18080'
      target: 8080
      protocol: tcp
  control-api:
    ports: !override
    - host_ip: 127.0.0.1
      published: '18082'
      target: 8080
      protocol: tcp
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/control
      target: /var/lib/homeserver
      read_only: false
      bind: &id001
        create_host_path: false
    - type: bind
      source: ${HOMESERVER_RUN_ROOT:-../.runtime/dev/run}
      target: /run/homeserver
      read_only: true
      bind: &id002
        create_host_path: false
    - type: bind
      source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
      target: /data
      read_only: true
      bind:
        create_host_path: false
  control-worker:
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/control
      target: /var/lib/homeserver
      read_only: false
      bind: *id001
    - type: bind
      source: ${HOMESERVER_RUN_ROOT:-../.runtime/dev/run}
      target: /run/homeserver
      read_only: true
      bind: *id002
    - type: bind
      source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
      target: /data
      read_only: false
      bind:
        create_host_path: false
  download-gateway:
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/control
      target: /var/lib/homeserver
      read_only: false
      bind: *id001
  telemetry:
    ports: !override
    - host_ip: 127.0.0.1
      published: '18081'
      target: 8080
      protocol: tcp
    volumes:
    - type: bind
      source: ${HOMESERVER_RUN_ROOT:-../.runtime/dev/run}
      target: /run/homeserver
      read_only: true
      bind: *id002
    - type: bind
      source: ${HOMESERVER_MEDIA_ROOT:-../.runtime/dev/data}
      target: /data
      read_only: true
      bind:
        create_host_path: false
  operator:
    volumes:
    - type: bind
      source: ${HOMESERVER_APPDATA_ROOT:-../.runtime/dev/appdata}/control
      target: /var/lib/homeserver
      read_only: false
      bind: *id001
    - type: bind
      source: ${HOMESERVER_RUN_ROOT:-../.runtime/dev/run}
      target: /run/homeserver
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMESERVER_INSTALL_ROOT:-../.runtime/dev/install}/shared/operator.env
      target: /run/homeserver/operator.env
      read_only: true
      bind:
        create_host_path: false
