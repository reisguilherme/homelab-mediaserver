worker_processes 2;
pid /tmp/nginx.pid;
# Native error logs can include tokens from query strings.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    client_max_body_size 2m;
    large_client_header_buffers 4 16k;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Only loopback Tailscale Serve supplies HTTPS metadata on the private port.
    map "$remote_addr:$http_x_forwarded_proto" $private_scheme {
        default $scheme;
        "172.30.240.17:https" https;
        "127.0.0.1:https" https;
    }
    server {
        listen 5055;
        server_name _;
        if ($private_scheme != https) {
            return 308 https://homelab.coin-capella.ts.net$request_uri;
        }
        location / {
            set $seerr_backend seerr:5055;
            proxy_pass http://$seerr_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $private_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }
}
