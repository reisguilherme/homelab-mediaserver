worker_processes 2;
pid /tmp/nginx.pid;
# Native error logs can include tokens from query strings.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    client_max_body_size 2m;
    large_client_header_buffers 4 16k;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    set_real_ip_from 172.30.248.2;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    geo $realip_remote_addr $edge_allowed { default 0; 172.30.248.2 1; }
    limit_conn_zone $binary_remote_addr zone=public_connections:10m;
    map $request_uri $jellyfin_request_uri {
        ~*^/jellyfin(?:/|\?|$) $request_uri;
        default /jellyfin$request_uri;
    }
    map $uri $jellyfin_public_cache_control {
        default $upstream_http_cache_control;
        ~*^(?:/jellyfin)?/Items/[^/]+/Images/ "private, no-store";
    }
    # Native Jellyfin upstream; policy is enforced before every request.
    map $uri $jellyfin_destination { default 172.28.64.20:8096; }
    server { listen 8097 default_server; server_name _; return 444; }
    server {
        listen 8097;
        server_name streaming.greis.dev.br;
        set $public_guard 172.30.248.4:8080;
        if ($edge_allowed = 0) { return 403; }
        limit_conn public_connections 120;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        # The guard revalidates the native session; only item images accept this cookie.
        add_header Set-Cookie $jellyfin_image_cookie always;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $jellyfin_public_cache_control always;
        location = /_authorize {
            internal;
            proxy_pass http://$public_guard/authorize/jellyfin;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host streaming.greis.dev.br:10443;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host streaming.greis.dev.br:10443;
            proxy_set_header X-Forwarded-Port 10443;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Verified-Authorization "";
            proxy_set_header X-API-Key "";
            proxy_set_header Remote-User "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Emby-Token $http_x_emby_token;
            proxy_set_header X-Emby-Authorization $http_x_emby_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
            proxy_set_header X-CSRF-TOKEN $http_x_csrf_token;
            proxy_connect_timeout 3s;
            proxy_read_timeout 12s;
        }
        location ~* ^(?:/jellyfin)?/Users/AuthenticateByName/?$ {
            client_max_body_size 16k;
            client_body_buffer_size 32k;
            proxy_pass http://$public_guard/login/jellyfin;
            proxy_set_header Host streaming.greis.dev.br:10443;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host streaming.greis.dev.br:10443;
            proxy_set_header X-Forwarded-Port 10443;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Verified-Authorization "";
            proxy_set_header X-API-Key "";
            proxy_set_header Remote-User "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Emby-Token $http_x_emby_token;
            proxy_set_header X-Emby-Authorization $http_x_emby_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
            proxy_set_header X-CSRF-TOKEN $http_x_csrf_token;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
        location ~* ^(?:/jellyfin)?/Users/Public/?$ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            default_type application/json;
            return 200 '[]';
        }
        location / {
            auth_request /_authorize;
            auth_request_set $verified_authorization $upstream_http_x_verified_authorization;
            auth_request_set $jellyfin_image_cookie $upstream_http_set_cookie;
            proxy_pass http://$jellyfin_destination$jellyfin_request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host streaming.greis.dev.br:10443;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host streaming.greis.dev.br:10443;
            proxy_set_header X-Forwarded-Port 10443;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Verified-Authorization "";
            proxy_set_header X-API-Key "";
            proxy_set_header Remote-User "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header Authorization $verified_authorization;
            proxy_set_header X-Emby-Token "";
            proxy_set_header X-Emby-Authorization "";
            proxy_set_header X-MediaBrowser-Token "";
            proxy_set_header Cookie "";
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
