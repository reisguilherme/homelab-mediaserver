# CPU default; generated CLI output derives ACCESS_MODE and de-duplicates addresses.
services:
  jellyfin-proxy:
    ports:
    - host_ip: ${HOMESERVER_LAN_BIND_IP:-127.0.0.1}
      published: ${HOMESERVER_JELLYFIN_PORT:-8096}
      target: 8096
      protocol: tcp
    - host_ip: ${HOMESERVER_TAILSCALE_BIND_IP:-127.0.0.1}
      published: ${HOMESERVER_JELLYFIN_PORT:-8096}
      target: 8096
      protocol: tcp
