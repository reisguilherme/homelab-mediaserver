worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS lets backends become available after this proxy starts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Jellyfin WebSocket URLs can carry an API key; omit the query from access logs.
    log_format homeserver '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent';
    access_log /var/log/nginx/access.log homeserver;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # $uri is normalized before matching; $request_uri below preserves the client URL.
    # A base URL prefix is allowed, but no Items DELETE reaches Jellyfin directly.
    map "$request_method:$uri" $jellyfin_destination {
        default jellyfin:8096;
        ~*^DELETE:(?:/[^/]+)*/Items(?:/|$) control-api:8080;
    }

    server {
        listen 8096;
        server_name _;
        client_max_body_size 0;

        location / {
            proxy_pass http://$jellyfin_destination$request_uri;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Emby-Token $http_x_emby_token;
            proxy_set_header X-Emby-Authorization $http_x_emby_authorization;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
