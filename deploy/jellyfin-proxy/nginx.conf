worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 1024;
}

http {
    # Private callers cannot replace their connection identity with XFF. The
    # dedicated bridge gateway is the host's loopback Tailscale Serve path;
    # verify that actual peer before enabling HTTPS on the deployed instance.
    map "$remote_addr:$http_x_forwarded_proto" $jellyfin_external_scheme {
        default $scheme;
        "127.0.0.1:https" https;
        "172.30.240.1:https" https;
    }
    # Docker's embedded DNS lets backends become available after this proxy starts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Jellyfin WebSocket URLs can carry an API key; omit the query from access logs.
    log_format homeserver '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent';
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # $uri is normalized before matching; $request_uri below preserves the client URL.
    # Collection/playlist membership changes stay native; item deletion is admitted.
    # A base URL prefix is allowed for both routes.
    map "$request_method:$uri" $jellyfin_destination {
        default jellyfin:8096;
        ~*^DELETE:(?!.*?/(?:Collections|Playlists)/[^/]+/Items/?$)(?:/[^/]+)*/Items(?:/|$) control-api:8080;
        # Catalog/playback DTOs and notifications carry subtitle DisplayTitle.
        ~*^GET:(?:/jellyfin)?/(?:Items(?:/[^/]+(?:/(?:Intros|LocalTrailers|SpecialFeatures|PlaybackInfo))?)?|Users/[^/]+/Items(?:/[^/]+(?:/(?:Intros|LocalTrailers|SpecialFeatures))?)?|UserItems/Resume|Shows/(?:NextUp|Upcoming|[^/]+/(?:Episodes|Seasons))|Videos/[^/]+/AdditionalParts|Sessions|LiveTv/(?:Channels(?:/[^/]+)?|Recordings(?:/[^/]+)?|Programs(?:/[^/]+)?)|Channels/[^/]+/Items|socket)/?$ jellyfin-relay:8083;
        ~*^POST:(?:/jellyfin)?/(?:Items/[^/]+/PlaybackInfo|LiveStreams/Open|LiveTv/Programs)/?$ jellyfin-relay:8083;
    }

    # Existing clients on :8096 may still use /Items, /web or /socket. Add the
    # native BaseUrl once, preserving the escaped path and query for every verb.
    map $request_uri $jellyfin_request_uri {
        ~*^/jellyfin(?:/|\?|$) $request_uri;
        default /jellyfin$request_uri;
    }

    server {
        listen 8096;
        server_name _;
        client_max_body_size 0;

        location / {
            proxy_pass http://$jellyfin_destination$jellyfin_request_uri;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $jellyfin_external_scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header Forwarded "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Emby-Token $http_x_emby_token;
            proxy_set_header X-Emby-Authorization $http_x_emby_authorization;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
