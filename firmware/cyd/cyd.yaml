esphome:
  name: homeserver-cyd
  friendly_name: HomeServer CYD

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
mqtt:
  broker: !secret mqtt_broker
  port: 8883
  ssl: true
  certificate_authority: !secret mqtt_ca_certificate
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: homeserver/v1/cyd-01
  birth_message:
    topic: homeserver/v1/cyd-01/availability
    payload: online
  will_message:
    topic: homeserver/v1/cyd-01/availability
    payload: offline
# Pinout and display/touch controller remain placeholders until the exact
# ESP32-2432S028 revision is identified; never flash this file unchanged.
