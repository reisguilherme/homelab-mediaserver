[project]
name = "homeserver"
version = "0.1.0"
description = "Reproducible media automation, admission control and telemetry for a personal home server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "services/control/src",
  "services/telemetry/src",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/control/src", "services/telemetry/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
