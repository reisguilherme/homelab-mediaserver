# Copiar para secrets/mediaserver-secrets.sops.yaml e criptografar com `sops -e -i`
apiVersion: v1
kind: Secret
metadata:
  name: mediaserver-secrets
  namespace: spoke-mediaserver
type: Opaque
stringData:
  ROOT_USERNAME: root
  ROOT_PASSWORD: REPLACE_WITH_UNIFIED_ROOT_PASSWORD
  # Chaves arbitrarias (32 chars hex cada, ex.: openssl rand -hex 16) — injetadas nativamente por env / initContainer:
  RADARR_API_KEY: REPLACE_WITH_32_HEX_RADARR_API_KEY
  SONARR_API_KEY: REPLACE_WITH_32_HEX_SONARR_API_KEY
  PROWLARR_API_KEY: REPLACE_WITH_32_HEX_PROWLARR_API_KEY
  BAZARR_API_KEY: REPLACE_WITH_32_HEX_BAZARR_API_KEY
  # Token arbitrario identico ao de homelab-hermes (ex.: amcp_ + openssl rand -hex 32); arr-mcp gera sha256 no boot:
  ARR_MCP_HERMES_TOKEN: amcp_REPLACE_WITH_64_HEX_TOKEN
  # Chaves dos bancos SQLite migrados do appdata (reutilizar do .private-vault ou gerar na UI apos cutover):
  SEERR_API_KEY: REPLACE_WITH_SEERR_API_KEY
  JELLYFIN_API_KEY: REPLACE_WITH_JELLYFIN_API_KEY
