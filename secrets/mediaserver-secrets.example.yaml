# Copiar para secrets/mediaserver-secrets.sops.yaml e criptografar com `sops -e -i`
apiVersion: v1
kind: Secret
metadata:
  name: mediaserver-secrets
  namespace: spoke-mediaserver
type: Opaque
stringData:
  RADARR_API_KEY: REPLACE_WITH_RADARR_API_KEY
  SONARR_API_KEY: REPLACE_WITH_SONARR_API_KEY
  PROWLARR_API_KEY: REPLACE_WITH_PROWLARR_API_KEY
  BAZARR_API_KEY: REPLACE_WITH_BAZARR_API_KEY
  SEERR_API_KEY: REPLACE_WITH_SEERR_API_KEY
  JELLYFIN_API_KEY: REPLACE_WITH_JELLYFIN_API_KEY
  QBITTORRENT_USERNAME: REPLACE_WITH_QBIT_USERNAME
  QBITTORRENT_PASSWORD: REPLACE_WITH_QBIT_PASSWORD
  ARR_MCP_UI_PASSWORD_HASH: REPLACE_WITH_SCRYPT_PASSWORD_HASH
  ARR_MCP_HERMES_TOKEN_HASH: sha256:REPLACE_WITH_SHA256_OF_HERMES_BEARER_TOKEN
