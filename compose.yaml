name: homeserver
services:
  service-proxy:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    networks:
    - edge_control
    volumes:
    - type: bind
      source: ./deploy/service-proxy/Caddyfile
      target: /etc/caddy/Caddyfile
      read_only: true
      bind:
        create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: ${HOMESERVER_LOG_MAX_SIZE_MB:-10}m
        max-file: ${HOMESERVER_LOG_MAX_FILES:-3}
    ports:
    - host_ip: 0.0.0.0
      published: '80'
      target: 80
      protocol: tcp
    depends_on:
      jellyfin-proxy:
        condition: service_started
      qbit-monitor:
        condition: service_started
      telemetry:
        condition: service_started
      init:
        condition: service_completed_successfully
  jellyfin:
    image: jellyfin/jellyfin@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
    restart: unless-stopped
    networks:
      public_jellyfin:
        ipv4_address: 172.30.240.2
    volumes:
    - type: bind
      source: /srv/appdata/jellyfin
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/media
      target: /data/media
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/transcode
      target: /transcode
      read_only: false
      bind:
        create_host_path: false
    logging: &id001
      driver: json-file
      options:
        max-size: ${HOMESERVER_LOG_MAX_SIZE_MB:-10}m
        max-file: ${HOMESERVER_LOG_MAX_FILES:-3}
    user: 1000:1000
    environment:
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      init:
        condition: service_completed_successfully
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    dns:
    - 1.1.1.1
    - 1.0.0.1
  jellyfin-proxy:
    image: nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    networks:
      public_jellyfin:
        ipv4_address: 172.30.240.6
        gw_priority: 1
      public_relay:
        ipv4_address: 172.30.240.36
      edge_control: {}
    volumes:
    - type: bind
      source: ./deploy/jellyfin-proxy/nginx.conf
      target: /etc/nginx/nginx.conf
      read_only: true
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '8096'
      target: 8096
      protocol: tcp
    depends_on:
      jellyfin:
        condition: service_started
      jellyfin-relay:
        condition: service_started
      control-api:
        condition: service_started
      init:
        condition: service_completed_successfully
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    user: 1000:1000
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=1000,gid=1000
    - /var/run:rw,noexec,nosuid,size=4m,uid=1000,gid=1000
    pids_limit: 128
    mem_limit: 256m
  seerr:
    init: true
    image: ghcr.io/seerr-team/seerr@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    restart: unless-stopped
    networks:
      public_seerr:
        ipv4_address: 172.30.240.18
      seerr_integration:
        ipv4_address: 172.30.240.66
    volumes:
    - type: bind
      source: /srv/appdata/seerr
      target: /app/config
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    user: 1000:1000
    environment:
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
      NODE_OPTIONS: --no-network-family-autoselection --dns-result-order=ipv4first
    depends_on:
      init:
        condition: service_completed_successfully
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    dns:
    - 1.1.1.1
    - 1.0.0.1
  sonarr:
    image: linuxserver/sonarr:4.0.15
    restart: unless-stopped
    networks:
      apps: {}
      edge_control: {}
      egress: {}
      automation_backends:
        ipv4_address: 172.30.240.100
    volumes:
    - type: bind
      source: /srv/appdata/sonarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data
      target: /data
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '8989'
      target: 8989
      protocol: tcp
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      init:
        condition: service_completed_successfully
  radarr:
    image: lscr.io/linuxserver/radarr@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
    restart: unless-stopped
    networks:
      apps: {}
      edge_control: {}
      egress: {}
      automation_backends:
        ipv4_address: 172.30.240.99
    volumes:
    - type: bind
      source: /srv/appdata/radarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data
      target: /data
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '7878'
      target: 7878
      protocol: tcp
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      init:
        condition: service_completed_successfully
  prowlarr:
    image: linuxserver/prowlarr:1.35.1
    restart: unless-stopped
    dns:
    - 1.1.1.1
    - 1.0.0.1
    networks:
    - apps
    - edge_control
    - egress
    volumes:
    - type: bind
      source: /srv/appdata/prowlarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '9696'
      target: 9696
      protocol: tcp
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      init:
        condition: service_completed_successfully
  bazarr:
    image: linuxserver/bazarr:1.6.2
    restart: unless-stopped
    networks:
    - apps
    - edge_control
    - egress
    volumes:
    - type: bind
      source: /srv/appdata/bazarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/media
      target: /data/media
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '6767'
      target: 6767
      protocol: tcp
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      init:
        condition: service_completed_successfully
    dns:
    - 1.1.1.1
    - 8.8.8.8
  qbittorrent:
    image: linuxserver/qbittorrent:5.1.2
    restart: unless-stopped
    networks:
    - transfer
    - egress_transfer
    volumes:
    - type: bind
      source: /srv/appdata/qbittorrent
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data
      target: /data
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
      WEBUI_PORT: '8080'
      TORRENTING_PORT: '6881'
    ports:
    - host_ip: 0.0.0.0
      published: '6881'
      target: 6881
      protocol: tcp
    - host_ip: 0.0.0.0
      published: '6881'
      target: 6881
      protocol: udp
    depends_on:
      init:
        condition: service_completed_successfully
  qbit-monitor:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    networks:
    - transfer
    - edge_control
    volumes:
    - type: bind
      source: ./deploy/qbit-monitor/Caddyfile
      target: /etc/caddy/Caddyfile
      read_only: true
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 127.0.0.1
      published: '18080'
      target: 8080
      protocol: tcp
    depends_on:
      init:
        condition: service_completed_successfully
  control-api:
    image: homeserver-control:dev
    restart: unless-stopped
    networks:
      edge_control: {}
      apps: {}
      telemetry: {}
      public_jellyfin:
        ipv4_address: 172.30.240.8
      public_seerr:
        ipv4_address: 172.30.240.23
    volumes:
    - &id002
      type: bind
      source: /srv/appdata/control
      target: /var/lib/homeserver
      read_only: false
      bind:
        create_host_path: false
    - &id003
      type: bind
      source: /srv/appdata/control
      target: /run/homeserver
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data
      target: /data
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: .
      target: /project
      read_only: true
      bind:
        create_host_path: false
    logging: *id001
    environment:
      HOMESERVER_CONFIG_VERSION: '1'
      HOMESERVER_ENVIRONMENT: prod
      HOMESERVER_INSTANCE_NAME: homeserver
      HOMESERVER_APPDATA_ROOT: /var/lib/homeserver
      HOMESERVER_MEDIA_ROOT: /data
      HOMESERVER_TRANSCODE_ROOT: /srv/transcode
      HOMESERVER_RUN_ROOT: /run/homeserver
      HOMESERVER_MEDIA_UUID: ''
      HOMESERVER_QBIT_GATEWAY_URL: http://download-gateway:8081
      HOMESERVER_QBIT_QUEUEING_ENABLED: 'true'
      HOMESERVER_UPLOAD_LIMIT_BYTES: '-1'
      HOMESERVER_DOWNLOAD_LIMIT_BYTES: '-1'
      HOMESERVER_SERVICE_UID: '1000'
      HOMESERVER_SERVICE_GID: '1000'
      HOMESERVER_RENDER_GID: '1000'
      HOMESERVER_VIDEO_GID: '1000'
      HOMESERVER_NETWORK_INTERFACE: auto
      HOMESERVER_ACCESS_MODE: tailscale
      HOMESERVER_LAN_BIND_IP: 127.0.0.1
      HOMESERVER_TAILSCALE_BIND_IP: 127.0.0.1
      HOMESERVER_QBIT_PEER_BIND_IP: 127.0.0.1
      HOMESERVER_TAILSCALE_HOSTNAME: ''
      HOMESERVER_JELLYFIN_PORT: '8096'
      HOMESERVER_JELLYFIN_PUBLIC_URL: ''
      HOMESERVER_SEERR_PORT: '5055'
      HOMESERVER_SEERR_PUBLIC_URL: ''
      HOMESERVER_SONARR_PORT: '8989'
      HOMESERVER_SONARR_PUBLIC_URL: ''
      HOMESERVER_RADARR_PORT: '7878'
      HOMESERVER_RADARR_PUBLIC_URL: ''
      HOMESERVER_PROWLARR_PORT: '9696'
      HOMESERVER_PROWLARR_PUBLIC_URL: ''
      HOMESERVER_BAZARR_PORT: '6767'
      HOMESERVER_BAZARR_PUBLIC_URL: ''
      HOMESERVER_CONTROL_PORT: '8080'
      HOMESERVER_CONTROL_PUBLIC_URL: ''
      HOMESERVER_STATUS_PORT: '8081'
      HOMESERVER_STATUS_PUBLIC_URL: ''
      HOMESERVER_QBIT_MONITOR_PORT: '18080'
      HOMESERVER_QBIT_MONITOR_PUBLIC_URL: ''
      HOMESERVER_JELLYFIN_URL: http://jellyfin:8096/jellyfin
      HOMESERVER_SEERR_URL: http://seerr:5055
      HOMESERVER_SONARR_URL: http://sonarr:8989/sonarr
      HOMESERVER_RADARR_URL: http://radarr:7878/radarr
      HOMESERVER_PROWLARR_URL: http://prowlarr:9696/prowlarr
      HOMESERVER_BAZARR_URL: http://bazarr:6767/bazarr
      HOMESERVER_QBIT_URL: http://qbittorrent:8080
      HOMESERVER_QBIT_PEER_PORT: '6881'
      HOMESERVER_TRANSCODE_MODE: cpu
      HOMESERVER_INTEL_RENDER_DEVICE: /dev/dri/renderD128
      HOMESERVER_MOVIE_QUEUE_PRIORITY: seeders
      HOMESERVER_SERIES_ORDER: sequential
      HOMESERVER_MOVIE_PRIORITY_INTERVAL_SECONDS: '60'
      HOMESERVER_HTTP_TIMEOUT_SECONDS: '15'
      HOMESERVER_SEARCH_TIMEOUT_SECONDS: '90'
      HOMESERVER_WORKER_CYCLE_TIMEOUT_SECONDS: '900'
      HOMESERVER_CAPACITY_SNAPSHOT_MAX_AGE_SECONDS: '30'
      HOMESERVER_SOURCE_PROTECTED_HASHES: ''
      HOMESERVER_WORKER_HEARTBEAT_MAX_AGE_SECONDS: '90'
      HOMESERVER_BYPARR_URL: http://byparr:8191
      HOMESERVER_ARR_UID: '1000'
      HOMESERVER_ARR_GID: '1000'
      HOMESERVER_WORKER_INTERVAL: '5'
      HOMESERVER_DB_PATH: /var/lib/homeserver/control.sqlite
      HOMESERVER_CAPACITY_SNAPSHOT: /run/homeserver/capacity.json
      HOMESERVER_HOST_SNAPSHOT: /run/homeserver/host.json
      HOMESERVER_RECOVERY_MODE: /var/lib/homeserver/RECOVERY_MODE
      HOMESERVER_MEDIA_ROOTS: /data/media:/data/torrents
      HOMESERVER_JELLYFIN_SUBTITLE_LABELS_ENABLED: 'true'
      HOMESERVER_JELLYFIN_SUBTITLE_LABEL_EN_US: English - US
      HOMESERVER_JELLYFIN_SUBTITLE_LABEL_PT_BR: Português BR
      HOMESERVER_JELLYFIN_COLLECTION_COVERS_ENABLED: 'true'
      HOMESERVER_JELLYFIN_COLLECTION_COVERS_INTERVAL_SECONDS: '300'
      HOMESERVER_SERVICE_ROLE: control-api
      HOMESERVER_ENV_PATH: /project/.env
      HOMESERVER_ENV_MODE: prod
    ports:
    - host_ip: 0.0.0.0
      published: '8080'
      target: 8080
      protocol: tcp
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=5).close()
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    command:
    - uvicorn
    - homeserver_control.api.app:app
    - --no-proxy-headers
    - --no-access-log
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --log-level
    - info
    - --ws-max-size
    - '8388608'
    entrypoint:
    - python
    - -m
    - homeserver_common.runtime
    user: 1000:1000
    build:
      context: .
      dockerfile: deploy/Dockerfile.control
    depends_on:
      init:
        condition: service_completed_successfully
  control-worker:
    image: homeserver-control:dev
    restart: unless-stopped
    networks:
      apps: {}
      egress: {}
      public_jellyfin:
        ipv4_address: 172.30.240.7
      public_seerr:
        ipv4_address: 172.30.240.22
    volumes:
    - *id002
    - *id003
    - type: bind
      source: /srv/data
      target: /data
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: .
      target: /project
      read_only: true
      bind:
        create_host_path: false
    logging: *id001
    environment:
      HOMESERVER_CONFIG_VERSION: '1'
      HOMESERVER_ENVIRONMENT: prod
      HOMESERVER_INSTANCE_NAME: homeserver
      HOMESERVER_APPDATA_ROOT: /var/lib/homeserver
      HOMESERVER_MEDIA_ROOT: /data
      HOMESERVER_TRANSCODE_ROOT: /srv/transcode
      HOMESERVER_RUN_ROOT: /run/homeserver
      HOMESERVER_MEDIA_UUID: ''
      HOMESERVER_QBIT_GATEWAY_URL: http://download-gateway:8081
      HOMESERVER_QBIT_QUEUEING_ENABLED: 'true'
      HOMESERVER_UPLOAD_LIMIT_BYTES: '-1'
      HOMESERVER_DOWNLOAD_LIMIT_BYTES: '-1'
      HOMESERVER_SERVICE_UID: '1000'
      HOMESERVER_SERVICE_GID: '1000'
      HOMESERVER_RENDER_GID: '1000'
      HOMESERVER_VIDEO_GID: '1000'
      HOMESERVER_NETWORK_INTERFACE: auto
      HOMESERVER_ACCESS_MODE: tailscale
      HOMESERVER_LAN_BIND_IP: 127.0.0.1
      HOMESERVER_TAILSCALE_BIND_IP: 127.0.0.1
      HOMESERVER_QBIT_PEER_BIND_IP: 127.0.0.1
      HOMESERVER_TAILSCALE_HOSTNAME: ''
      HOMESERVER_JELLYFIN_PORT: '8096'
      HOMESERVER_JELLYFIN_PUBLIC_URL: ''
      HOMESERVER_SEERR_PORT: '5055'
      HOMESERVER_SEERR_PUBLIC_URL: ''
      HOMESERVER_SONARR_PORT: '8989'
      HOMESERVER_SONARR_PUBLIC_URL: ''
      HOMESERVER_RADARR_PORT: '7878'
      HOMESERVER_RADARR_PUBLIC_URL: ''
      HOMESERVER_PROWLARR_PORT: '9696'
      HOMESERVER_PROWLARR_PUBLIC_URL: ''
      HOMESERVER_BAZARR_PORT: '6767'
      HOMESERVER_BAZARR_PUBLIC_URL: ''
      HOMESERVER_CONTROL_PORT: '8080'
      HOMESERVER_CONTROL_PUBLIC_URL: ''
      HOMESERVER_STATUS_PORT: '8081'
      HOMESERVER_STATUS_PUBLIC_URL: ''
      HOMESERVER_QBIT_MONITOR_PORT: '18080'
      HOMESERVER_QBIT_MONITOR_PUBLIC_URL: ''
      HOMESERVER_JELLYFIN_URL: http://jellyfin:8096/jellyfin
      HOMESERVER_SEERR_URL: http://seerr:5055
      HOMESERVER_SONARR_URL: http://sonarr:8989/sonarr
      HOMESERVER_RADARR_URL: http://radarr:7878/radarr
      HOMESERVER_PROWLARR_URL: http://prowlarr:9696/prowlarr
      HOMESERVER_BAZARR_URL: http://bazarr:6767/bazarr
      HOMESERVER_QBIT_URL: http://qbittorrent:8080
      HOMESERVER_QBIT_PEER_PORT: '6881'
      HOMESERVER_TRANSCODE_MODE: cpu
      HOMESERVER_INTEL_RENDER_DEVICE: /dev/dri/renderD128
      HOMESERVER_MOVIE_QUEUE_PRIORITY: seeders
      HOMESERVER_SERIES_ORDER: sequential
      HOMESERVER_MOVIE_PRIORITY_INTERVAL_SECONDS: '60'
      HOMESERVER_HTTP_TIMEOUT_SECONDS: '15'
      HOMESERVER_SEARCH_TIMEOUT_SECONDS: '90'
      HOMESERVER_WORKER_CYCLE_TIMEOUT_SECONDS: '900'
      HOMESERVER_CAPACITY_SNAPSHOT_MAX_AGE_SECONDS: '30'
      HOMESERVER_SOURCE_PROTECTED_HASHES: ''
      HOMESERVER_WORKER_HEARTBEAT_MAX_AGE_SECONDS: '90'
      HOMESERVER_BYPARR_URL: http://byparr:8191
      HOMESERVER_ARR_UID: '1000'
      HOMESERVER_ARR_GID: '1000'
      HOMESERVER_WORKER_INTERVAL: '5'
      HOMESERVER_DB_PATH: /var/lib/homeserver/control.sqlite
      HOMESERVER_CAPACITY_SNAPSHOT: /run/homeserver/capacity.json
      HOMESERVER_HOST_SNAPSHOT: /run/homeserver/host.json
      HOMESERVER_RECOVERY_MODE: /var/lib/homeserver/RECOVERY_MODE
      HOMESERVER_MEDIA_ROOTS: /data/media:/data/torrents
      HOMESERVER_JELLYFIN_SUBTITLE_LABELS_ENABLED: 'true'
      HOMESERVER_JELLYFIN_SUBTITLE_LABEL_EN_US: English - US
      HOMESERVER_JELLYFIN_SUBTITLE_LABEL_PT_BR: Português BR
      HOMESERVER_JELLYFIN_COLLECTION_COVERS_ENABLED: 'true'
      HOMESERVER_JELLYFIN_COLLECTION_COVERS_INTERVAL_SECONDS: '300'
      HOMESERVER_SERVICE_ROLE: control-worker
      HOMESERVER_ENV_PATH: /project/.env
      HOMESERVER_ENV_MODE: prod
    command:
    - python
    - -m
    - homeserver_control.worker
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import os,time; from homeserver_control.persistence.heartbeat import WorkerHeartbeatStore;
        assert WorkerHeartbeatStore(os.environ['HOMESERVER_DB_PATH']).ready(now=time.time(),max_age=float(os.environ.get('HOMESERVER_WORKER_HEARTBEAT_MAX_AGE_SECONDS','90')))
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint:
    - python
    - -m
    - homeserver_common.runtime
    user: 1000:1000
    depends_on:
      init:
        condition: service_completed_successfully
  download-gateway:
    image: homeserver-control:dev
    restart: unless-stopped
    networks:
    - apps
    - transfer
    volumes:
    - *id002
    - *id003
    - type: bind
      source: /srv/data
      target: /data
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: .
      target: /project
      read_only: true
      bind:
        create_host_path: false
    logging: *id001
    environment:
      HOMESERVER_CONFIG_VERSION: '1'
      HOMESERVER_ENVIRONMENT: prod
      HOMESERVER_INSTANCE_NAME: homeserver
      HOMESERVER_APPDATA_ROOT: /var/lib/homeserver
      HOMESERVER_MEDIA_ROOT: /data
      HOMESERVER_TRANSCODE_ROOT: /srv/transcode
      HOMESERVER_RUN_ROOT: /run/homeserver
      HOMESERVER_MEDIA_UUID: ''
      HOMESERVER_QBIT_GATEWAY_URL: http://download-gateway:8081
