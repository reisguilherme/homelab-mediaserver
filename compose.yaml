      HOMESERVER_RADARR_URL: http://radarr:7878
      HOMESERVER_PROWLARR_URL: http://prowlarr:9696
      HOMESERVER_BAZARR_URL: http://bazarr:6767
      HOMESERVER_QBIT_URL: http://qbittorrent:8080
      HOMESERVER_QBIT_PEER_PORT: '6881'
      HOMESERVER_TRANSCODE_MODE: cpu
      HOMESERVER_INTEL_RENDER_DEVICE: /dev/dri/renderD128
      HOMESERVER_MOVIE_QUEUE_PRIORITY: seeders
      HOMESERVER_SERIES_ORDER: sequential
      HOMESERVER_MOVIE_PRIORITY_INTERVAL_SECONDS: '60'
      HOMESERVER_HTTP_TIMEOUT_SECONDS: '15'
      HOMESERVER_SEARCH_TIMEOUT_SECONDS: '90'
      HOMESERVER_WORKER_CYCLE_TIMEOUT_SECONDS: '900'
      HOMESERVER_CAPACITY_SNAPSHOT_MAX_AGE_SECONDS: '30'
      HOMESERVER_SOURCE_PROTECTED_HASHES: ''
      HOMESERVER_WORKER_HEARTBEAT_MAX_AGE_SECONDS: '90'
      HOMESERVER_BYPARR_URL: http://byparr:8191
      HOMESERVER_ARR_UID: '1000'
      HOMESERVER_ARR_GID: '1000'
      HOMESERVER_WORKER_INTERVAL: '5'
      HOMESERVER_DB_PATH: /var/lib/homeserver/control.sqlite
      HOMESERVER_CAPACITY_SNAPSHOT: /run/homeserver/capacity.json
      HOMESERVER_HOST_SNAPSHOT: /run/homeserver/host.json
      HOMESERVER_RECOVERY_MODE: /var/lib/homeserver/RECOVERY_MODE
      HOMESERVER_MEDIA_ROOTS: /data/media:/data/torrents
      HOMESERVER_ENV_PATH: /project/.env
      HOMESERVER_ENV_MODE: prod
    ports:
    - host_ip: 0.0.0.0
      published: '8080'
      target: 8080
      protocol: tcp
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=5).close()
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    command:
    - uvicorn
    - homeserver_control.api.app:app
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --log-level
    - info
    entrypoint:
    - python
    - -m
    - homeserver_common.runtime
    user: 1000:1000
    build:
      context: .
      dockerfile: deploy/Dockerfile.control
    depends_on:
      init:
        condition: service_completed_successfully
