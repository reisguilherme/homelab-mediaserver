# HomeServer pessoal. Edite .env e execute docker compose up -d --build.
name: homeserver
services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    restart: unless-stopped
    networks:
    - apps
    - telemetry
    - egress
    volumes:
    - type: bind
      source: /srv/appdata/jellyfin
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/media
      target: /data/media
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/transcode
      target: /transcode
      read_only: false
      bind:
        create_host_path: false
    logging: &id001
      driver: json-file
      options:
        max-size: ${HOMESERVER_LOG_MAX_SIZE_MB:-10}m
        max-file: ${HOMESERVER_LOG_MAX_FILES:-3}
    user: 1000:1000
    environment:
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      init:
        condition: service_completed_successfully
  jellyfin-proxy:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    networks:
    - apps
    - edge_control
    volumes:
    - type: bind
      source: ./deploy/jellyfin-proxy/nginx.conf
      target: /etc/nginx/nginx.conf
      read_only: true
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '8096'
      target: 8096
      protocol: tcp
    depends_on:
      jellyfin:
        condition: service_started
      control-api:
        condition: service_started
      init:
        condition: service_completed_successfully
  seerr:
    image: fallenbagel/jellyseerr:2.7.3
    restart: unless-stopped
    networks:
    - apps
    - edge_control
    - egress
    volumes:
    - type: bind
      source: /srv/appdata/seerr
      target: /app/config
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '5055'
      target: 5055
      protocol: tcp
    user: 1000:1000
    environment:
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
      NODE_OPTIONS: --no-network-family-autoselection --dns-result-order=ipv4first
    depends_on:
      init:
        condition: service_completed_successfully
  sonarr:
    image: linuxserver/sonarr:4.0.15
    restart: unless-stopped
    networks:
    - apps
    - edge_control
    - egress
    volumes:
    - type: bind
      source: /srv/appdata/sonarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data
      target: /data
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '8989'
      target: 8989
      protocol: tcp
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      init:
        condition: service_completed_successfully
  radarr:
    image: lscr.io/linuxserver/radarr@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
    restart: unless-stopped
    networks:
    - apps
    - edge_control
    - egress
    volumes:
    - type: bind
      source: /srv/appdata/radarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data
      target: /data
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '7878'
      target: 7878
      protocol: tcp
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      init:
        condition: service_completed_successfully
  prowlarr:
    image: linuxserver/prowlarr:1.35.1
    restart: unless-stopped
    networks:
    - apps
    - edge_control
    - egress
    volumes:
    - type: bind
      source: /srv/appdata/prowlarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '9696'
      target: 9696
      protocol: tcp
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      init:
        condition: service_completed_successfully
  bazarr:
    image: linuxserver/bazarr:1.5.1
    restart: unless-stopped
    networks:
    - apps
    - edge_control
    - egress
    volumes:
    - type: bind
      source: /srv/appdata/bazarr
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/media
      target: /data/media
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 0.0.0.0
      published: '6767'
      target: 6767
      protocol: tcp
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      init:
        condition: service_completed_successfully
  qbittorrent:
    image: linuxserver/qbittorrent:5.1.2
    restart: unless-stopped
    networks:
    - transfer
    - egress_transfer
    volumes:
    - type: bind
      source: /srv/appdata/qbittorrent
      target: /config
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data
      target: /data
      read_only: false
      bind:
        create_host_path: false
    logging: *id001
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
      WEBUI_PORT: '8080'
      TORRENTING_PORT: '6881'
    ports:
    - host_ip: 0.0.0.0
      published: '6881'
      target: 6881
      protocol: tcp
    - host_ip: 0.0.0.0
      published: '6881'
      target: 6881
      protocol: udp
    depends_on:
      init:
        condition: service_completed_successfully
  qbit-monitor:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    networks:
    - transfer
    - edge_control
    volumes:
    - type: bind
      source: ./deploy/qbit-monitor/Caddyfile
      target: /etc/caddy/Caddyfile
      read_only: true
      bind:
        create_host_path: false
    logging: *id001
    ports:
    - host_ip: 127.0.0.1
      published: '18080'
      target: 8080
      protocol: tcp
    depends_on:
      init:
        condition: service_completed_successfully
  control-api:
    image: homeserver-control:dev
    restart: unless-stopped
    networks:
    - edge_control
    - apps
    - telemetry
    volumes:
    - &id002
      type: bind
      source: /srv/appdata/control
      target: /var/lib/homeserver
      read_only: false
      bind:
        create_host_path: false
    - &id003
      type: bind
      source: /srv/appdata/control
      target: /run/homeserver
      read_only: true
      bind: &id004
        create_host_path: false
    - type: bind
      source: /srv/data
      target: /data
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: .
      target: /project
      read_only: true
      bind:
        create_host_path: false
    logging: *id001
    environment:
      HOMESERVER_CONFIG_VERSION: '1'
      HOMESERVER_ENVIRONMENT: prod
      HOMESERVER_INSTANCE_NAME: homeserver
      HOMESERVER_APPDATA_ROOT: /var/lib/homeserver
      HOMESERVER_MEDIA_ROOT: /data
      HOMESERVER_TRANSCODE_ROOT: /srv/transcode
      HOMESERVER_RUN_ROOT: /run/homeserver
      HOMESERVER_MEDIA_UUID: ''
      HOMESERVER_QBIT_GATEWAY_URL: http://download-gateway:8081
      HOMESERVER_QBIT_QUEUEING_ENABLED: 'true'
      HOMESERVER_UPLOAD_LIMIT_BYTES: '-1'
      HOMESERVER_DOWNLOAD_LIMIT_BYTES: '-1'
      HOMESERVER_SERVICE_UID: '1000'
      HOMESERVER_SERVICE_GID: '1000'
      HOMESERVER_RENDER_GID: '1000'
      HOMESERVER_VIDEO_GID: '1000'
      HOMESERVER_NETWORK_INTERFACE: auto
      HOMESERVER_ACCESS_MODE: tailscale
      HOMESERVER_LAN_BIND_IP: 127.0.0.1
      HOMESERVER_TAILSCALE_BIND_IP: 127.0.0.1
      HOMESERVER_QBIT_PEER_BIND_IP: 127.0.0.1
      HOMESERVER_TAILSCALE_HOSTNAME: ''
      HOMESERVER_JELLYFIN_PORT: '8096'
      HOMESERVER_JELLYFIN_PUBLIC_URL: ''
      HOMESERVER_SEERR_PORT: '5055'
      HOMESERVER_SEERR_PUBLIC_URL: ''
      HOMESERVER_SONARR_PORT: '8989'
      HOMESERVER_SONARR_PUBLIC_URL: ''
      HOMESERVER_RADARR_PORT: '7878'
      HOMESERVER_RADARR_PUBLIC_URL: ''
      HOMESERVER_PROWLARR_PORT: '9696'
      HOMESERVER_PROWLARR_PUBLIC_URL: ''
      HOMESERVER_BAZARR_PORT: '6767'
      HOMESERVER_BAZARR_PUBLIC_URL: ''
      HOMESERVER_CONTROL_PORT: '8080'
      HOMESERVER_CONTROL_PUBLIC_URL: ''
      HOMESERVER_STATUS_PORT: '8081'
      HOMESERVER_STATUS_PUBLIC_URL: ''
      HOMESERVER_QBIT_MONITOR_PORT: '18080'
      HOMESERVER_QBIT_MONITOR_PUBLIC_URL: ''
