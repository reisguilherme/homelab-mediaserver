apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr-mcp
  namespace: spoke-mediaserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arr-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arr-mcp
    spec:
      restartPolicy: Always
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: render-config
          image: ghcr.io/bardesss/arr-mcp:2.2.1@sha256:52267602cdc0847927608bea4c5e7196fc586edda199bde91fa5fe75911827fa
          command:
            - node
            - --input-type=module
            - -e
            - |
              import { createHash } from 'node:crypto';
              import { readFileSync, writeFileSync } from 'node:fs';
              import { hashPassword } from '/app/dist/src/core/session.js';
              const rootUser = process.env.ROOT_USERNAME || 'root';
              const rootPass = process.env.ROOT_PASSWORD || '';
              const hermesTok = process.env.ARR_MCP_HERMES_TOKEN || '';
              const hermesHash = hermesTok && !hermesTok.startsWith('REPLACE_WITH_')
                ? 'sha256:' + createHash('sha256').update(hermesTok).digest('hex')
                : '';
              const uiHash = rootPass && !rootPass.startsWith('REPLACE_WITH_')
                ? await hashPassword(rootPass)
                : '';
              let cfg = readFileSync('/template/config.yaml', 'utf8');
              cfg = cfg.replaceAll('__ROOT_USERNAME__', rootUser);
              cfg = cfg.replaceAll('__ARR_MCP_HERMES_TOKEN_HASH__', hermesHash);
              const dashboardHash = process.env.DASHBOARD_TOKEN_HASH;
              if (!/^sha256:[a-f0-9]{64}$/.test(dashboardHash ?? '')) {
                throw new Error('Dashboard token digest is missing or invalid');
              }
              cfg = cfg.replaceAll('__ARR_MCP_DASHBOARD_TOKEN_HASH__', dashboardHash);
              if (uiHash) {
                cfg = cfg.replaceAll('__ARR_MCP_UI_PASSWORD_HASH__', uiHash);
              } else {
                cfg = cfg.replace(/^  password_hash: __ARR_MCP_UI_PASSWORD_HASH__\r?\n/m, '');
              }
              writeFileSync('/config/config.yaml', cfg, 'utf8');
          env:
            - name: DASHBOARD_TOKEN_HASH
              valueFrom:
                secretKeyRef:
                  name: dashboard-reader
                  key: token-hash
          envFrom:
            - secretRef:
                name: mediaserver-secrets
                optional: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: arr-mcp
          image: ghcr.io/bardesss/arr-mcp:2.2.1@sha256:52267602cdc0847927608bea4c5e7196fc586edda199bde91fa5fe75911827fa
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: ARR_MCP_CONFIG_DIR
              value: /config
            - name: ARR_MCP_PORT
              value: "6060"
            - name: LOG_LEVEL
              value: info
          envFrom:
            - secretRef:
                name: mediaserver-secrets
                optional: true
          ports:
            - name: http
              containerPort: 6060
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6060
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6060
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config-template
          configMap:
            name: arr-mcp-config
        - name: config
          persistentVolumeClaim:
            claimName: arr-mcp-config
---
apiVersion: v1
kind: Service
metadata:
  name: arr-mcp
  namespace: spoke-mediaserver
spec:
  selector:
    app.kubernetes.io/name: arr-mcp
  ports:
    - name: http
      port: 6060
      targetPort: 6060
