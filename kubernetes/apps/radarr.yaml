apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: spoke-mediaserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      restartPolicy: Always
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Sao_Paulo
            # Restored configs may contain the legacy AuthenticationEnabled override.
            - name: RADARR__AUTH__ENABLED
              value: "false"
            - name: RADARR__AUTH__METHOD
              value: External
            - name: RADARR__AUTH__REQUIRED
              value: Enabled
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: mediaserver-secrets
                  key: RADARR_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 7878
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: data
          persistentVolumeClaim:
            claimName: mediaserver-data-rw
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: spoke-mediaserver
spec:
  selector:
    app.kubernetes.io/name: radarr
  ports:
    - name: http
      port: 7878
      targetPort: 7878
