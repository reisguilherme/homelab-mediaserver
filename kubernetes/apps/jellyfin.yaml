apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: spoke-mediaserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      restartPolicy: Always
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups: [44, 109]
      initContainers:
        - name: sync-abyss-branding
          image: homeserver-jellyfin-abyss:12.2-2f809171-r6
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /config/config
              BRANDING="/config/config/branding.xml"
              if [ -f "$BRANDING" ]; then
                sed -i "s|/jellyfin/web/ui/abyss.css|/web/ui/abyss.css|g" "$BRANDING"
              else
                cat > "$BRANDING" <<'EOF'
              <?xml version="1.0" encoding="utf-8"?>
              <BrandingOptions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
                <LoginDisclaimer />
                <CustomCss>/* HOMELAB ABYSS START */
              @import url('/web/ui/abyss.css?v=2f809171-r6');
              /* HOMELAB ABYSS END */
              </CustomCss>
                <SplashscreenEnabled>false</SplashscreenEnabled>
              </BrandingOptions>
              EOF
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          image: homeserver-jellyfin-abyss:12.2-2f809171-r6
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.greis.dev.br
          ports:
            - name: http
              containerPort: 8096
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: transcode
              mountPath: /transcode
            - name: media-ro
              mountPath: /data/media
              readOnly: true
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: transcode
          persistentVolumeClaim:
            claimName: jellyfin-transcode-scratch
        - name: media-ro
          persistentVolumeClaim:
            claimName: mediaserver-library-ro
            readOnly: true
        - name: dri
          hostPath:
            path: /dev/dri
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: spoke-mediaserver
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: 8096
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-lan-tv
  namespace: spoke-mediaserver
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: 8096
      nodePort: 30096
