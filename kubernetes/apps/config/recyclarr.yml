            score: 160
          - name: Max Quality
            score: 160
      - trash_ids:
          - 5608c71bcebba0a5e666223bae8c9227 # HD Bluray Tier 03
        assign_scores_to:
          - name: Standard
            score: 140
          - name: Dublado
            score: 140
          - name: Max Quality
            score: 140
      - trash_ids:
          - 4d74ac4c4db0b64bff6ce0cffef99bf0 # UHD Bluray Tier 01
        assign_scores_to:
          - name: Max Quality
            score: 180
      - trash_ids:
          - a58f517a70193f8e578056642178419d # UHD Bluray Tier 02
        assign_scores_to:
          - name: Max Quality
            score: 160
      - trash_ids:
          - e71939fae578037e7aed3ee219bbe7c1 # UHD Bluray Tier 03
