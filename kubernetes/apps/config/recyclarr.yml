radarr:
  radarr-homeserver:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    quality_profiles:
      - name: Standard
        reset_unmatched_scores:
          enabled: true
        min_format_score: 10
        min_upgrade_format_score: 1
        upgrade:
          allowed: true
          until_quality: HomeServer 1080p
          until_score: 10000
        quality_sort: top
        qualities:
          - name: HomeServer 1080p
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
      - name: Dublado
        reset_unmatched_scores:
          enabled: true
        min_format_score: 10
        min_upgrade_format_score: 1
        upgrade:
          allowed: true
          until_quality: HomeServer 1080p
          until_score: 10000
        quality_sort: top
        qualities:
          - name: HomeServer 1080p
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
      - name: Max Quality
        reset_unmatched_scores:
          enabled: true
        min_format_score: 10
        min_upgrade_format_score: 1
        upgrade:
          allowed: true
          until_quality: Remux-2160p
          until_score: 10000
        quality_sort: top
        qualities:
          - name: Remux-2160p
          - name: HomeServer 2160p
            qualities:
              - Bluray-2160p
              - WEBDL-2160p
          - name: Remux-1080p
          - name: HomeServer 1080p
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
    custom_formats:
      # Unwanted releases (TRaSH Guides)
      - trash_ids:
          - ed38b889b31be83fda192888e2286d83 # BR-DISK
          - 90a6f9a284dff5103f6346090e6280c8 # LQ
          - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
          - 0a3f082873eb454bde444150b70253cc # Extras
        assign_scores_to:
          - name: Standard
            score: -10000
          - name: Dublado
            score: -10000
          - name: Max Quality
            score: -10000
      # HQ Release Groups (calibrated below Dublado PT-BR priority)
      - trash_ids:
          - ed27ebfef2f323e964fb1f61391bcb35 # HD Bluray Tier 01
        assign_scores_to:
          - name: Standard
            score: 180
          - name: Dublado
            score: 180
