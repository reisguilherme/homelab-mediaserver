apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: spoke-mediaserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr
    spec:
      restartPolicy: Always
      initContainers:
        - name: sync-auth
          image: lscr.io/linuxserver/bazarr:1.5.1
          command:
            - python3
            - -c
            - |
              import hashlib, os, pathlib, yaml
              cfg = pathlib.Path("/config/config/config.yaml")
              if not cfg.exists():
                  raise SystemExit(0)
              data = yaml.safe_load(cfg.read_text(encoding="utf-8")) or {}
              auth = data.setdefault("auth", {})
              auth["username"] = os.environ.get("ROOT_USERNAME") or "root"
              root_pass = os.environ.get("ROOT_PASSWORD") or ""
              if root_pass and not root_pass.startswith("REPLACE_WITH_"):
                  auth["password"] = hashlib.md5(root_pass.encode("utf-8")).hexdigest()
              data.setdefault("general", {})["base_url"] = ""
              radarr_cfg = data.setdefault("radarr", {})
              radarr_cfg["ip"] = "radarr"
              radarr_cfg["port"] = 7878
              radarr_cfg["base_url"] = ""
              sonarr_cfg = data.setdefault("sonarr", {})
              sonarr_cfg["ip"] = "sonarr"
              sonarr_cfg["port"] = 8989
              sonarr_cfg["base_url"] = ""
              for env_key, section in (
                  ("BAZARR_API_KEY", auth),
                  ("RADARR_API_KEY", radarr_cfg),
                  ("SONARR_API_KEY", sonarr_cfg),
              ):
                  val = os.environ.get(env_key, "")
                  if val and not val.startswith("REPLACE_WITH_"):
                      section["apikey"] = val
              cfg.write_text(yaml.safe_dump(data, sort_keys=False), encoding="utf-8")
              os.chown(cfg, 1000, 1000)
          envFrom:
            - secretRef:
                name: mediaserver-secrets
                optional: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:1.5.1
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Sao_Paulo
          ports:
            - name: http
              containerPort: 6767
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /api/system/ping
              port: 6767
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/system/ping
              port: 6767
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: data
          persistentVolumeClaim:
            claimName: mediaserver-data-rw
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: spoke-mediaserver
spec:
  selector:
    app.kubernetes.io/name: bazarr
  ports:
    - name: http
      port: 6767
      targetPort: 6767
