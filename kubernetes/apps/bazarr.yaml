apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: spoke-mediaserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr
    spec:
      restartPolicy: Always
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:1.6.2
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Sao_Paulo
            - name: DYNACONF_AUTH__TYPE
              value: "@none"
            - name: DYNACONF_GENERAL__BASE_URL
              value: '@json ""'
            - name: DYNACONF_RADARR__IP
              value: radarr
            - name: DYNACONF_RADARR__PORT
              value: "7878"
            - name: DYNACONF_RADARR__BASE_URL
              value: '@json ""'
            - name: DYNACONF_SONARR__IP
              value: sonarr
            - name: DYNACONF_SONARR__PORT
              value: "8989"
            - name: DYNACONF_SONARR__BASE_URL
              value: '@json ""'
            - name: BAZARR_API_KEY
              valueFrom:
                secretKeyRef: { name: mediaserver-secrets, key: BAZARR_API_KEY }
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef: { name: mediaserver-secrets, key: RADARR_API_KEY }
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef: { name: mediaserver-secrets, key: SONARR_API_KEY }
            # Force strings, including keys consisting entirely of digits.
            - name: DYNACONF_AUTH__APIKEY
              value: "@str $(BAZARR_API_KEY)"
            - name: DYNACONF_RADARR__APIKEY
              value: "@str $(RADARR_API_KEY)"
            - name: DYNACONF_SONARR__APIKEY
              value: "@str $(SONARR_API_KEY)"
          ports:
            - name: http
              containerPort: 6767
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          livenessProbe:
            tcpSocket:
              port: 6767
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 6767
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: data
          persistentVolumeClaim:
            claimName: mediaserver-data-rw
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: spoke-mediaserver
spec:
  selector:
    app.kubernetes.io/name: bazarr
  ports:
    - name: http
      port: 6767
      targetPort: 6767
