apiVersion: apps/v1
kind: Deployment
metadata:
  name: byparr
  namespace: spoke-mediaserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: byparr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: byparr
    spec:
      restartPolicy: Always
      containers:
        - name: byparr
          image: ghcr.io/thephaseless/byparr:1.0.0
          command: ["/app/.venv/bin/python3", "main.py"]
          env:
            - name: TZ
              value: America/Sao_Paulo
          ports:
            - name: http
              containerPort: 8191
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1280Mi
          livenessProbe:
            tcpSocket:
              port: 8191
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8191
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: byparr
  namespace: spoke-mediaserver
spec:
  selector:
    app.kubernetes.io/name: byparr
  ports:
    - name: http
      port: 8191
      targetPort: 8191
