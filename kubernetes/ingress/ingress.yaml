apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediaserver-ingress
  namespace: spoke-mediaserver
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
    - host: overseer.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seerr
                port:
                  number: 5055
    - host: radarr.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
    - host: sonarr.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  number: 8989
    - host: prowlarr.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 9696
    - host: bazarr.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bazarr
                port:
                  number: 6767
    - host: qbittorrent.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
    - host: media-mcp.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arr-mcp
                port:
                  number: 6060
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-legacy-strip-prefix
  namespace: spoke-mediaserver
spec:
  stripPrefix:
    prefixes:
      - /jellyfin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-legacy-subpath
  namespace: spoke-mediaserver
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: spoke-mediaserver-jellyfin-legacy-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.greis.dev.br
      http:
        paths:
          - path: /jellyfin
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
