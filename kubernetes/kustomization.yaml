apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spoke-mediaserver

resources:
  - base/namespace.yaml
  - base/storage.yaml
  - base/network-policies.yaml
  - base/dashboard-metrics.yaml
  - apps/intel-gpu-plugin.yaml
  - apps/jellyfin.yaml
  - apps/qbittorrent.yaml
  - apps/radarr.yaml
  - apps/sonarr.yaml
  - apps/prowlarr.yaml
  - apps/bazarr.yaml
  - apps/seerr.yaml
  - apps/byparr.yaml
  - apps/recyclarr.yaml
  - apps/arr-mcp.yaml
  - ingress/ingress.yaml

configMapGenerator:
  - name: recyclarr-config
    options:
      disableNameSuffixHash: true
    files:
      - recyclarr.yml=apps/config/recyclarr.yml
      - settings.yml=apps/config/recyclarr-settings.yml
  - name: recyclarr-cfs-radarr
    options:
      disableNameSuffixHash: true
    files:
      - homeserver-bluray.json=apps/config/recyclarr-cfs/radarr/homeserver-bluray.json
      - homeserver-original.json=apps/config/recyclarr-cfs/radarr/homeserver-original.json
      - homeserver-dual-ptbr-original.json=apps/config/recyclarr-cfs/radarr/homeserver-dual-ptbr-original.json
      - homeserver-asc-dual-original.json=apps/config/recyclarr-cfs/radarr/homeserver-asc-dual-original.json
  - name: recyclarr-cfs-sonarr
    options:
      disableNameSuffixHash: true
    files:
      - homeserver-bluray.json=apps/config/recyclarr-cfs/sonarr/homeserver-bluray.json
      - homeserver-original.json=apps/config/recyclarr-cfs/sonarr/homeserver-original.json
      - homeserver-dual-ptbr-original.json=apps/config/recyclarr-cfs/sonarr/homeserver-dual-ptbr-original.json
      - homeserver-asc-dual-original.json=apps/config/recyclarr-cfs/sonarr/homeserver-asc-dual-original.json
  - name: arr-mcp-config
    files:
      - config.yaml=apps/config/arr-mcp.yaml
