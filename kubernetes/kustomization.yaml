apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spoke-mediaserver

resources:
  - base/namespace.yaml
  - base/storage.yaml
  - base/network-policies.yaml
  - apps/intel-gpu-plugin.yaml
  - apps/jellyfin.yaml
  - apps/qbittorrent.yaml
  - apps/radarr.yaml
  - apps/sonarr.yaml
  - apps/prowlarr.yaml
  - apps/bazarr.yaml
  - apps/seerr.yaml
  - apps/byparr.yaml
  - apps/recyclarr.yaml
  - apps/arr-mcp.yaml
  - ingress/ingress.yaml

configMapGenerator:
  - name: recyclarr-config
    files:
      - recyclarr.yml=apps/config/recyclarr.yml
  - name: arr-mcp-config
    files:
      - config.yaml=apps/config/arr-mcp.yaml

generatorOptions:
  disableNameSuffixHash: true
