# Storage estático no disco físico 18 TB (/mnt/storage) mantendo hardlinks atômicos em /data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediaserver-data-rw
spec:
  capacity:
    storage: 16Ti
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/storage/homeserver
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediaserver-data-rw
  namespace: spoke-mediaserver
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: mediaserver-data-rw
  resources:
    requests:
      storage: 16Ti
---
# Biblioteca somente leitura exclusiva do Jellyfin
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediaserver-library-ro
spec:
  capacity:
    storage: 16Ti
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/storage/homeserver/media
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediaserver-library-ro
  namespace: spoke-mediaserver
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: ""
  volumeName: mediaserver-library-ro
  resources:
    requests:
      storage: 16Ti
---
# Disco NVMe secundário dedicado a transcode do Jellyfin
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-transcode-scratch
spec:
  capacity:
    storage: 40Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/transcode/jellyfin
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-transcode-scratch
  namespace: spoke-mediaserver
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: jellyfin-transcode-scratch
  resources:
    requests:
      storage: 40Gi
---
