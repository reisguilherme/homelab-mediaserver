name: homeserver-playback
services:
  jellyfin:
    image: homeserver-jellyfin-abyss:12.2-2f809171-r6
    build:
      context: ./deploy/abyss
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    pids_limit: 256
    cpus: 4.0
    entrypoint: [/bin/sh, /usr/local/bin/playback-entrypoint.sh]
    command: [/jellyfin/jellyfin]
    environment:
      TZ: ${HOMESERVER_TIMEZONE:-America/Sao_Paulo}
      PLAYBACK_NFS_SOURCE: ${PLAYBACK_NFS_SOURCE:?NFS export required}
      PLAYBACK_TRANSCODE_ID: ${PLAYBACK_TRANSCODE_ID:?transcode filesystem UUID required}
    ports:
      - host_ip: ${PLAYBACK_BIND_IP:?private VM address required}
        published: '8096'
        target: 8096
        protocol: tcp
    volumes:
      - type: bind
        source: /srv/appdata/jellyfin
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: /srv/appdata/jellyfin-cache
        target: /cache
        bind: {create_host_path: false}
      - type: bind
        source: /srv/transcode/data
        target: /transcode
        bind: {create_host_path: false}
      - type: bind
        source: /srv/transcode/.homelab-volume-id
        target: /run/transcode-volume-id
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/media-view/media
        target: /data/media
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /proc/1/mountinfo
        target: /run/host-mountinfo
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /var/lib/homelab-storage/admission
        target: /run/storage-admission
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /proc/sys/kernel/random/boot_id
        target: /run/guest-boot-id
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./scripts/playback-entrypoint.sh
        target: /usr/local/bin/playback-entrypoint.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./scripts/playback-admission.sh
        target: /usr/local/bin/playback-admission.sh
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: [CMD-SHELL, '/bin/sh /usr/local/bin/playback-entrypoint.sh --check >/dev/null && test "$$(curl -fsS --max-time 5 http://127.0.0.1:8096/jellyfin/health)" = Healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
