# Opt-in, standalone project. Do not merge this file into compose.yaml.
name: homeserver-observability

services:
  homeserver-metrics:
    build:
      context: .
      dockerfile: deploy/Dockerfile.telemetry
    command:
      - python
      - -m
      - uvicorn
      - homeserver_telemetry.metrics:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    environment:
      HOMESERVER_METRICS_SNAPSHOT_DIR: /run/homeserver-metrics
      PYTHONDONTWRITEBYTECODE: "1"
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    networks: [observability]
    volumes:
      - type: bind
        source: ${HOMESERVER_OBSERVABILITY_DIR:-/srv/appdata/observability}/snapshots
        target: /run/homeserver-metrics
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=4GB
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped
    networks: [observability]
    volumes:
      - type: bind
        source: ./deploy/observability/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOMESERVER_OBSERVABILITY_DIR:-/srv/appdata/observability}/prometheus
        target: /prometheus
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${HOMESERVER_GRAFANA_ADMIN_USER:?Set HOMESERVER_GRAFANA_ADMIN_USER in the private .env}
      GF_SECURITY_ADMIN_PASSWORD: ${HOMESERVER_GRAFANA_ADMIN_PASSWORD:?Set HOMESERVER_GRAFANA_ADMIN_PASSWORD in the private .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_MODE: console
    user: "472:472"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    restart: unless-stopped
    networks: [observability]
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - type: bind
        source: ${HOMESERVER_OBSERVABILITY_DIR:-/srv/appdata/observability}/grafana
        target: /var/lib/grafana
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/observability/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

networks:
  observability:
    internal: true
