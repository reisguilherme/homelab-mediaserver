# Opt-in, standalone project. Do not merge this file into compose.yaml.
name: homeserver-observability

services:
  homeserver-metrics:
    build:
      context: .
      dockerfile: deploy/Dockerfile.telemetry
    command:
      - python
      - -m
      - uvicorn
      - homeserver_telemetry.metrics:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    environment:
      HOMESERVER_METRICS_SNAPSHOT_DIR: /run/homeserver-metrics
      PYTHONDONTWRITEBYTECODE: "1"
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    networks:
      metrics:
        aliases: [media-metrics]
    volumes:
      - type: bind
        source: ${HOMESERVER_OBSERVABILITY_DIR:-/srv/appdata/observability}/snapshots
        target: /run/homeserver-metrics
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

networks:
  metrics:
    external: true
    name: homelab-metrics
